name: lyo

services:
  # ── Application ─────────────────────────────────────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/backend.Dockerfile
    ports:
      - "${SERVER_PORT:-8080}:8080"
    env_file:
      - ../.env
    environment:
      # Overrides the host-facing DATABASE_URL/SMTP_HOST from .env: inside the
      # compose network "localhost" is the backend container itself, not its peers.
      DATABASE_URL: postgres://lyo:lyo_secret@postgres:5432/lyo?sslmode=disable
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      PROMETHEUS_URL: http://prometheus:9090
      # Same expression as the grafana service below — the two ends of the alert
      # webhook must hold the identical value or every notification 401s. This
      # `environment` entry deliberately overrides any ALERT_WEBHOOK_SECRET in
      # ../.env, so the secret has exactly one source: Compose's own environment.
      ALERT_WEBHOOK_SECRET: ${ALERT_WEBHOOK_SECRET:-lyo_dev_alert_secret}
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    restart: unless-stopped

  # ── Database ─────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lyo
      POSTGRES_USER: lyo
      POSTGRES_PASSWORD: lyo_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lyo"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Mail (dev SMTP catcher — no auth, view sent mail at http://localhost:8025) ─
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    restart: unless-stopped

  # ── Object storage (S3-compatible, MinIO) ─────────────────────────────────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lyo_minio
      MINIO_ROOT_PASSWORD: lyo_minio_secret
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console (http://localhost:9001)
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # One-shot bucket bootstrap — creates the bucket and exits; safe to re-run.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 lyo_minio lyo_minio_secret &&
      mc mb --ignore-existing local/lyo-tracks &&
      mc anonymous set download local/lyo-tracks
      "
    restart: "no"

  pgadmin:
    image: dpage/pgadmin4:9
    environment:
      PGADMIN_DEFAULT_EMAIL: some@one.com
      PGADMIN_DEFAULT_PASSWORD: someone
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── Observability ─────────────────────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./otel-collector-config.yml:/etc/otel-collector-config.yml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.3.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.0
    ports:
      - "3100:3100"
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.7.2
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"   # Tempo API / Grafana datasource
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Expanded by Grafana into the provisioned webhook contact point. Shares
      # the expression above with the backend, so both ends always agree.
      ALERT_WEBHOOK_SECRET: ${ALERT_WEBHOOK_SECRET:-lyo_dev_alert_secret}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  pgadmin_data:
  prometheus_data:
  grafana_data:
  tempo_data:

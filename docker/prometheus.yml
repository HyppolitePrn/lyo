global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: lyo

scrape_configs:
  # Application metrics, republished by the collector's Prometheus exporter.
  - job_name: lyo-backend
    static_configs:
      - targets: ["otel-collector:8889"]

  # The collector's own health. If this stops, application metrics are stale
  # rather than zero — a distinction the incident rules depend on.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

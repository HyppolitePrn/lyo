name: lyo-prod

services:
  # ── Edge / TLS ────────────────────────────────────────────────────────────────
  # The only container with published ports. Everything below is reachable only
  # on the Compose network, so the platform has no plaintext entry point.
  caddy:
    image: caddy:2.10-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # Certificates are issued for this name and for grafana.<name>. Left at
      # the default, Caddy signs with its internal CA so the stack still comes
      # up on a machine without a domain.
      LYO_DOMAIN: ${LYO_DOMAIN:-localhost}
      # ACME contact address — Let's Encrypt sends expiry warnings here.
      ACME_EMAIL: ${ACME_EMAIL:-admin@localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Issued certificates and ACME account keys. Without this volume every
      # restart re-requests certificates and hits Let's Encrypt rate limits.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - grafana
      - minio
    restart: unless-stopped

  # ── Application ──────────────────────────────────────────────────────────────
  backend:
    image: ghcr.io/${GHCR_OWNER:-hyppoliteprn}/lyo-backend:latest
    # No published port: the API is served through Caddy over TLS only.
    expose:
      - "8080"
    env_file: .env
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      PROMETHEUS_URL: http://prometheus:9090
      APP_ENV: production
      # Two hosts for one bucket, and they must differ. S3_ENDPOINT is how this
      # container reaches MinIO (Compose network, plaintext, never leaves the
      # host). S3_PUBLIC_ENDPOINT is baked into presigned upload URLs and into
      # every track's audio_url, so it has to be the name the phone resolves —
      # and it is signed into the SigV4 signature, which is why it cannot be
      # rewritten after the fact.
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: https://s3.${LYO_DOMAIN:-localhost}
      # Behind Caddy the socket peer is always the proxy. This tells the server
      # to read the client address from X-Forwarded-For instead, so rate limits
      # and audit logs name the caller rather than the edge container.
      TRUSTED_PROXY: "true"
      CORS_ALLOWED_ORIGINS: https://${LYO_DOMAIN:-localhost}
      # Same expression as the grafana service — both ends of the alert webhook
      # resolve from one source and cannot drift apart. Required here: a silent
      # mismatch would mean every alert notification is rejected with a 401.
      ALERT_WEBHOOK_SECRET: ${ALERT_WEBHOOK_SECRET:?set ALERT_WEBHOOK_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    restart: unless-stopped

  # ── Database ──────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lyo}
      POSTGRES_USER: ${POSTGRES_USER:-lyo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Port NOT exposed externally in production
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lyo}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Object storage ────────────────────────────────────────────────────────────
  # Track audio. No published port, like everything else here: the phone reaches
  # it over TLS at s3.${LYO_DOMAIN}, which Caddy proxies (see docker/Caddyfile).
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      # These are the S3 credentials the backend signs with. They must match
      # S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY in .env, and unlike the dev
      # stack they have no default: a shared deployment must not fall back to
      # a password published in this repository.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    expose:
      - "9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # One-shot bucket bootstrap — creates the bucket and exits; safe to re-run.
  # The backend waits on it, so a fresh volume cannot serve presigned URLs for
  # a bucket that does not exist yet.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-lyo-tracks}
    # `anonymous set download` makes objects readable without a signature, and
    # only readable: writes still require the presigned PUT the API issues.
    # A track's audio_url is played by just_audio straight from this host, and
    # a plain <audio>-style GET carries no credentials.
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$S3_BUCKET_NAME &&
      mc anonymous set download local/$$S3_BUCKET_NAME
      "
    restart: "no"

  # ── Observability ─────────────────────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./otel-collector-config.yml:/etc/otel-collector-config.yml:ro
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.3.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.0
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.7.2
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/var/tempo
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Grafana builds absolute URLs (alert links, OAuth redirects) from this.
      # Without it they point at http://localhost:3000, which is unreachable now
      # that the port is no longer published.
      GF_SERVER_ROOT_URL: https://grafana.${LYO_DOMAIN:-localhost}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      # Expanded by Grafana into the provisioned webhook contact point.
      ALERT_WEBHOOK_SECRET: ${ALERT_WEBHOOK_SECRET:?set ALERT_WEBHOOK_SECRET}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    # No published port: reached through Caddy at grafana.${LYO_DOMAIN}.
    expose:
      - "3000"
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped

volumes:
  caddy_data:
  minio_data:
  caddy_config:
  postgres_data:
  prometheus_data:
  grafana_data:
  tempo_data:

# The Collector is the only thing the application talks to (ADR 009): the
# backend exports OTLP and knows nothing about Prometheus, Loki or Tempo.
# Swapping any backend below is a change to this file, not to the Go code.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Guards the collector against being OOM-killed by a burst of telemetry —
  # losing the collector loses visibility precisely when things go wrong.
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20

  batch:
    timeout: 5s
    send_batch_size: 1024

exporters:
  # Metrics are pulled from here by Prometheus. resource_to_telemetry_conversion
  # copies service.name/deployment.environment onto every series, so dashboards
  # can filter by environment.
  prometheus:
    endpoint: "0.0.0.0:8889"
    resource_to_telemetry_conversion:
      enabled: true
    enable_open_metrics: true

  # Loki ingests OTLP logs natively; the dedicated loki exporter is deprecated.
  otlphttp/loki:
    endpoint: http://loki:3100/otlp

  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    metrics:
      # The collector's own metrics, scraped by Prometheus as job
      # "otel-collector": a dropped export must itself be observable.
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki]

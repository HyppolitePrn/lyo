openapi: "3.1.0"

info:
  title: Lyo API
  version: "1.0.0"
  description: >
    REST API for the Lyo audio streaming platform.
    Real-time audio broadcast via WebSocket is handled out-of-band and is not documented here.

servers:
  - url: http://localhost:8080
    description: Local development

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:    { type: integer }
        message: { type: string }

    # ── Auth ──────────────────────────────────────────────────────────────────
    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 30 }
        email:    { type: string, format: email }
        password: { type: string, minLength: 8 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:    { type: string, format: email }
        password: { type: string }

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    TokenResponse:
      type: object
      required: [access_token, refresh_token]
      properties:
        access_token:  { type: string }
        refresh_token: { type: string }

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token:    { type: string }
        password: { type: string, minLength: 8 }

    MessageResponse:
      type: object
      required: [message]
      properties:
        message: { type: string }

    # ── Users ─────────────────────────────────────────────────────────────────
    Role:
      type: string
      enum: [anonymous, user, broadcaster, admin]

    User:
      type: object
      required: [id, username, email, role, favorite_track_ids, favorite_stream_ids, favorite_playlist_ids, created_at, updated_at]
      properties:
        id:                    { type: string, format: uuid }
        username:              { type: string }
        email:                 { type: string, format: email }
        role:                  { $ref: '#/components/schemas/Role' }
        favorite_track_ids:    { type: array, items: { type: string, format: uuid } }
        favorite_stream_ids:   { type: array, items: { type: string, format: uuid } }
        favorite_playlist_ids: { type: array, items: { type: string, format: uuid } }
        created_at:            { type: string, format: date-time }
        updated_at:            { type: string, format: date-time }

    UpdateUserRequest:
      type: object
      properties:
        username: { type: string, minLength: 3, maxLength: 30 }
        email:    { type: string, format: email }

    # ── Tracks ────────────────────────────────────────────────────────────────
    Track:
      type: object
      required: [id, broadcaster_id, title, audio_url, duration_seconds, created_at]
      properties:
        id:               { type: string, format: uuid }
        broadcaster_id:   { type: string, format: uuid }
        title:            { type: string }
        artist:           { type: string }
        audio_url:        { type: string, format: uri }
        duration_seconds: { type: integer, minimum: 0 }
        created_at:       { type: string, format: date-time }

    CreateTrackRequest:
      type: object
      required: [title, audio_url]
      properties:
        title:            { type: string, minLength: 1, maxLength: 200 }
        artist:           { type: string, maxLength: 200 }
        audio_url:        { type: string, format: uri }
        duration_seconds: { type: integer, minimum: 0 }

    TrackList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Track' } }

    PresignUploadRequest:
      type: object
      required: [filename]
      properties:
        filename: { type: string, minLength: 1, maxLength: 255 }

    PresignedUploadResponse:
      type: object
      required: [upload_url, key, audio_url]
      properties:
        upload_url: { type: string, format: uri, description: "PUT the audio file here" }
        key:        { type: string, description: "S3 object key" }
        audio_url:  { type: string, format: uri, description: "Public URL to pass as audio_url when calling POST /tracks once the upload completes" }

    # ── Streams ───────────────────────────────────────────────────────────────
    StreamStatus:
      type: string
      enum: [live, ended]

    Stream:
      type: object
      required: [id, broadcaster_id, title, status, started_at]
      properties:
        id:             { type: string, format: uuid }
        broadcaster_id: { type: string, format: uuid }
        title:          { type: string }
        description:    { type: string }
        status:         { $ref: '#/components/schemas/StreamStatus' }
        started_at:     { type: string, format: date-time }
        ended_at:       { type: string, format: date-time }

    CreateStreamRequest:
      type: object
      required: [title]
      properties:
        title:       { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 500 }

    StreamList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Stream' } }

    # ── Playlists ─────────────────────────────────────────────────────────────
    Playlist:
      type: object
      required: [id, owner_id, title, track_ids, is_public, created_at, updated_at]
      properties:
        id:          { type: string, format: uuid }
        owner_id:    { type: string, format: uuid }
        title:       { type: string }
        description: { type: string }
        track_ids:   { type: array, items: { type: string, format: uuid } }
        # Populated (in track_ids order) only by GET /playlists/{id}; omitted elsewhere.
        tracks:      { type: array, items: { $ref: '#/components/schemas/Track' } }
        is_public:   { type: boolean }
        created_at:  { type: string, format: date-time }
        updated_at:  { type: string, format: date-time }

    CreatePlaylistRequest:
      type: object
      required: [title]
      properties:
        title:       { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        is_public:   { type: boolean, default: false }

    UpdatePlaylistRequest:
      type: object
      properties:
        title:       { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        is_public:   { type: boolean }

    PlaylistList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Playlist' } }

    AddTrackToPlaylistRequest:
      type: object
      required: [track_id]
      properties:
        track_id: { type: string, format: uuid }

    FavoritesList:
      type: object
      required: [tracks, streams, playlists]
      properties:
        tracks:    { type: array, items: { $ref: '#/components/schemas/Track' } }
        streams:   { type: array, items: { $ref: '#/components/schemas/Stream' } }
        playlists: { type: array, items: { $ref: '#/components/schemas/Playlist' } }

    # ── Feature Flags ─────────────────────────────────────────────────────────
    FeatureFlag:
      type: object
      required: [id, name, enabled, description, updated_at]
      properties:
        id:          { type: string, format: uuid }
        name:        { type: string }
        enabled:     { type: boolean }
        description: { type: string }
        updated_at:  { type: string, format: date-time }

    FeatureFlagList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/FeatureFlag' } }

    ToggleFlagRequest:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }

    # ── Admin: Supervision ────────────────────────────────────────────────────
    IncidentSeverity:
      type: string
      enum: [critical, warning, info]

    IncidentFamily:
      type: string
      description: >
        technical = the platform itself failed.
        experience = nothing is broken and users are suffering anyway (audio
        dropped, listeners cut off). The two demand different reactions.
      enum: [technical, experience]

    IncidentStatus:
      type: string
      enum: [firing, acknowledged, resolved]

    Incident:
      type: object
      required: [id, title, severity, family, status, started_at]
      properties:
        id:              { type: string, format: uuid }
        rule_uid:        { type: string }
        title:           { type: string }
        summary:         { type: string }
        severity:        { $ref: '#/components/schemas/IncidentSeverity' }
        family:          { $ref: '#/components/schemas/IncidentFamily' }
        status:          { $ref: '#/components/schemas/IncidentStatus' }
        dashboard_url:   { type: string }
        started_at:      { type: string, format: date-time }
        acknowledged_at: { type: string, format: date-time }
        acknowledged_by: { type: string, format: uuid }
        resolved_at:     { type: string, format: date-time }

    IncidentList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Incident' } }

    UpdateIncidentRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          description: >
            acknowledge records that an admin owns a firing incident.
            resolve closes it by hand, for conditions that cleared without
            Grafana saying so.
          enum: [acknowledge, resolve]

    IncidentCounts:
      type: object
      required: [firing, acknowledged, critical_firing, resolved_24h]
      properties:
        firing:          { type: integer }
        acknowledged:    { type: integer }
        critical_firing: { type: integer }
        resolved_24h:    { type: integer }

    SupervisionMetrics:
      type: object
      description: >
        Current platform readings, queried from Prometheus. Every field is
        optional: a metric with no series yet (no traffic, no live stream) is
        absent rather than zero, so the client can tell "nothing happened" from
        "nothing measured".
      properties:
        backend_up:               { type: boolean }
        live_streams:             { type: number }
        active_listeners:         { type: number }
        requests_per_second:      { type: number }
        error_rate_percent:       { type: number }
        latency_p95_seconds:      { type: number }
        chunks_dropped_per_second: { type: number }

    SupervisionSummary:
      type: object
      required: [incidents, generated_at, metrics_available]
      properties:
        incidents:  { $ref: '#/components/schemas/IncidentCounts' }
        metrics:    { $ref: '#/components/schemas/SupervisionMetrics' }
        # False when Prometheus is unreachable or unconfigured — the incident
        # counts stay valid and the client shows the metrics as unavailable
        # rather than as zero.
        metrics_available: { type: boolean }
        generated_at: { type: string, format: date-time }

    # ── Health ────────────────────────────────────────────────────────────────
    HealthResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }

  responses:
    Unauthorized:
      description: Missing or invalid JWT
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Insufficient role
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnprocessableEntity:
      description: Validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServiceUnavailable:
      description: Feature disabled, or a dependency timed out
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

security: []

paths:
  # ── Health ─────────────────────────────────────────────────────────────────
  /health:
    get:
      operationId: GetHealth
      summary: Health check
      tags: [health]
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }

  # ── Auth ───────────────────────────────────────────────────────────────────
  /auth/register:
    post:
      operationId: Register
      summary: Create a new account
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        "201":
          description: Account created; returns token pair
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        "422": { $ref: '#/components/responses/UnprocessableEntity' }

  /auth/login:
    post:
      operationId: Login
      summary: Authenticate and obtain tokens
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        "200":
          description: Successful login
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /auth/refresh:
    post:
      operationId: RefreshToken
      summary: Exchange a refresh token for a new token pair
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        "200":
          description: New token pair
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /auth/forgot-password:
    post:
      operationId: ForgotPassword
      summary: Request a password reset email
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForgotPasswordRequest' }
      responses:
        "200":
          description: Always returns 200 to avoid leaking whether the email exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }

  /auth/reset-password:
    post:
      operationId: ResetPassword
      summary: Reset password using a token from the reset email
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        "400": { $ref: '#/components/responses/BadRequest' }

  # ── Users ──────────────────────────────────────────────────────────────────
  /users/me:
    get:
      operationId: GetUserByID
      summary: Return the authenticated user's profile
      tags: [users]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        "401": { $ref: '#/components/responses/Unauthorized' }
    patch:
      operationId: UpdateUserByID
      summary: Update the authenticated user's profile
      tags: [users]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        "200":
          description: Updated user profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "422": { $ref: '#/components/responses/UnprocessableEntity' }

  /users/me/favorites:
    get:
      operationId: ListFavorites
      summary: List the authenticated user's favorite tracks, streams, and playlists
      tags: [users]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Favorites, hydrated with full objects
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FavoritesList' }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /users/me/favorites/tracks/{trackId}:
    parameters:
      - name: trackId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: FavoriteTrack
      summary: Add a track to favorites
      tags: [users]
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Track added to favorites
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: UnfavoriteTrack
      summary: Remove a track from favorites
      tags: [users]
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Track removed from favorites
        "401": { $ref: '#/components/responses/Unauthorized' }

  /users/me/favorites/streams/{streamId}:
    parameters:
      - name: streamId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: FavoriteStream
      summary: Add a stream to favorites
      tags: [users]
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Stream added to favorites
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: UnfavoriteStream
      summary: Remove a stream from favorites
      tags: [users]
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Stream removed from favorites
        "401": { $ref: '#/components/responses/Unauthorized' }

  /users/me/favorites/playlists/{playlistId}:
    parameters:
      - name: playlistId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: FavoritePlaylist
      summary: Add a playlist to favorites
      tags: [users]
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Playlist added to favorites
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: UnfavoritePlaylist
      summary: Remove a playlist from favorites
      tags: [users]
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Playlist removed from favorites
        "401": { $ref: '#/components/responses/Unauthorized' }

  # ── Tracks ─────────────────────────────────────────────────────────────────
  /tracks/upload-url:
    post:
      operationId: CreateTrackUploadURL
      summary: Get a presigned S3 PUT URL for uploading track audio (broadcaster+ only)
      tags: [tracks]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PresignUploadRequest' }
      responses:
        "200":
          description: Presigned upload URL and object key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PresignedUploadResponse' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /tracks:
    get:
      operationId: ListTracks
      summary: List tracks (public)
      tags: [tracks]
      parameters:
        - name: broadcaster_id
          in: query
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Track list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrackList' }
    post:
      operationId: CreateTrack
      summary: Upload a new track (broadcaster+ only)
      tags: [tracks]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTrackRequest' }
      responses:
        "201":
          description: Track created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Track' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /tracks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: GetTrack
      summary: Get a single track
      tags: [tracks]
      responses:
        "200":
          description: Track details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Track' }
        "404": { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: DeleteTrack
      summary: Delete a track (owner or admin)
      tags: [tracks]
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Track deleted
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  # ── Streams ────────────────────────────────────────────────────────────────
  /streams:
    get:
      operationId: ListStreams
      summary: List streams (public)
      tags: [streams]
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/StreamStatus' }
      responses:
        "200":
          description: Stream list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StreamList' }
    post:
      operationId: CreateStream
      summary: Start a new broadcast (broadcaster+ only)
      tags: [streams]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateStreamRequest' }
      responses:
        "201":
          description: Stream created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Stream' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /streams/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: GetStream
      summary: Get a single stream
      tags: [streams]
      responses:
        "200":
          description: Stream details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Stream' }
        "404": { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: DeleteStream
      summary: End a broadcast (owner or admin)
      tags: [streams]
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Stream ended
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  # ── Playlists ──────────────────────────────────────────────────────────────
  /playlists:
    get:
      operationId: ListPlaylists
      summary: List the authenticated user's playlists
      tags: [playlists]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Playlist list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaylistList' }
        "401": { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: CreatePlaylist
      summary: Create a new playlist
      tags: [playlists]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePlaylistRequest' }
      responses:
        "201":
          description: Playlist created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Playlist' }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /playlists/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: GetPlaylist
      summary: Get a playlist
      tags: [playlists]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Playlist
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Playlist' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: UpdatePlaylist
      summary: Update playlist metadata
      tags: [playlists]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePlaylistRequest' }
      responses:
        "200":
          description: Updated playlist
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Playlist' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

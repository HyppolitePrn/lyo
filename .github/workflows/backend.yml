name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

jobs:
  ci:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: true

      - name: Install golangci-lint
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b /usr/local/bin v2.11.2

      - name: golangci-lint
        run: golangci-lint run ./...

      - name: Generate API types
        run: go generate ./internal/api/

      - name: Test (race detector)
        run: go test -race -coverprofile=coverage.out ./...

      # internal/api/api.gen.go is produced by oapi-codegen and is not hand-written,
      # so it is excluded from the metric the threshold applies to.
      - name: Enforce coverage threshold (80%)
        run: |
          grep -v 'internal/api/api.gen.go' coverage.out > coverage.nogen.out
          pct=$(go tool cover -func=coverage.nogen.out | awk '/^total:/ {print substr($3, 1, length($3)-1)}')
          echo "Coverage (excluding generated code): ${pct}%"
          awk -v p="$pct" 'BEGIN { if (p+0 < 80) { print "FAIL: coverage " p "% is below the 80% threshold"; exit 1 } }'

      - name: Build
        run: go build ./cmd/server

      - name: Upload coverage
        uses: actions/upload-artifact@v6
        with:
          name: backend-coverage
          path: backend/coverage.out

  deploy:
    name: Build image & Deploy to VPS
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./docker/backend.Dockerfile
          push: true
          tags: |
            ghcr.io/hyppoliteprn/lyo-backend:latest
            ghcr.io/hyppoliteprn/lyo-backend:sha-${{ github.sha }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            docker compose -f docker-compose.prod.yml pull backend
            # `up -d` (not `up -d backend`): the backend no longer publishes a
            # port, so it is only reachable once the Caddy edge is running. A
            # backend-only deploy on a host that predates the reverse proxy
            # would take the API offline. Compose recreates changed services
            # only, so this stays a no-op for everything else.
            docker compose -f docker-compose.prod.yml up -d